name: PR Size Alert

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-pr-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Prerequisites
        run: ./.github/scripts/install_prereqs.sh

      - name: Check PR Size
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_LINES: '500'
          MAX_FILES: '10'
        run: python .github/scripts/check_pr_size.py
        
      - name: Send Slack Alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python .github/scripts/send_slack.py
        
      - name: Send Email Alert
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: dev-team-alerts@yourcompany.com
        run: python .github/scripts/send_email.py

      - name: Enforce PR Size (Fail Check)
        run: |
          if [ -f "alert_payload.json" ]; then
            REASON=$(python3 -c "import json; print(json.load(open('alert_payload.json'))['reasons'])")
            echo "::error title=PR Size Limit Exceeded::${REASON}"
            echo "🚨 Failing the GitHub Check because PR size thresholds were exceeded: ${REASON}"
            exit 1
          fi
