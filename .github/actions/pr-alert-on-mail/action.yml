name: Send Email Alert
description: 'Sends an alert via Email if a PR is too large'

inputs:
  exceeds_threshold:
    description: 'Boolean string indicating if the threshold was exceeded'
    required: true
  total_changes:
    description: 'Total number of lines changed'
    required: true
  pr_url:
    description: 'The HTML URL of the Pull Request'
    required: true
  pr_number:
    description: 'The number of the Pull Request'
    required: true
  actor:
    description: 'The user who opened the Pull Request'
    required: true
  smtp_username:
    description: 'SMTP username for email alerts'
    required: true
  smtp_password:
    description: 'SMTP password for email alerts'
    required: true
  smtp_server:
    description: 'SMTP server address'
    required: false
    default: 'smtp.gmail.com'
  alert_email_to:
    description: 'Email address to send the alert to'
    required: true
  alert_email_from:
    description: 'Email address sending the alert'
    required: false
    default: 'GitHub Actions <actions@yourcompany.com>'

runs:
  using: "composite"
  steps:
    - name: Send Email Alert
      if: ${{ inputs.exceeds_threshold == 'true' }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ inputs.smtp_server }}
        server_port: 465
        username: ${{ inputs.smtp_username }}
        password: ${{ inputs.smtp_password }}
        subject: "🚨 Large PR Alert: PR #${{ inputs.pr_number }}"
        body: "Pull Request #${{ inputs.pr_number }} by ${{ inputs.actor }} is exceptionally large (${{ inputs.total_changes }} lines changed).\n\nPlease review: ${{ inputs.pr_url }}"
        to: ${{ inputs.alert_email_to }}
        from: ${{ inputs.alert_email_from }}
